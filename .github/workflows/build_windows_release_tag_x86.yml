
name: Build QuickRay Windows (MSVC x86, Release Tag)

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Download raylib
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git raylib

      - name: Configure QuickRay
        run: |
          cmake -S . -B build -A x86

      - name: Compile QuickRay
        run: |
          cmake --build build --config Release

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: QuickRay-Windows-x86
          path: build/Release/
          if-no-files-found: error
          archive: false

      - name: Rename executable for release
        run: |
          Rename-Item -Path build/Release/QuickRay.exe -NewName QuickRay-${{ github.ref_name }}-x86.exe

      - name: Upload executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build/Release/QuickRay-${{ github.ref_name }}-x86.exe
          fail_on_unmatched_files: true